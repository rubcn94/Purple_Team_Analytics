name: Deploy WebApp to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/document-app-workflow-68Hc2
    paths:
      - 'webapp/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: webapp

      - name: Build
        run: npm run build
        working-directory: webapp

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webapp/dist
          force_orphan: true
